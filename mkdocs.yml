site_name: libfake
site_author: 'Pymmdrza@gmail.com'
repo_url: 'https://github.com/pymmdrza/libfake'
edit_uri: 'root/main/docs/'
site_description: 'First name , Surname and Email Fake Mode in Python with Library Fake.'
site_url: !ENV READTHEDOCS_CANONICAL_URL
copyright: 'Copyright © 2025, Pymmdrza'

nav:
  - Home: index.md
  - Install: '#install'
  - Usage: '#usage'
  - Owner: 'https://mmdrza.com'

theme:
  name: readthedocs
  locale: en
  collapse_by_default: false
  include_homepage_in_sidebar: true
  features:
    - navigation.tabs
    - navigation.instant

plugins:
  - search:
      indexing: 'full'

markdown_extensions:
  - smarty
  - toc:
      permalink: true
      separator: "-"
  - sane_lists
