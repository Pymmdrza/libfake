name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.7', '3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test CLI basic functionality
      run: |
        python -m libfake --version
        python -m libfake --firstname --quiet
        python -m libfake --surname --quiet
        python -m libfake --fullname --quiet
        python -m libfake --email --quiet

    - name: Test CLI with count
      run: |
        python -m libfake --firstname --count 3 --quiet
        python -m libfake --generate --count 2 --quiet

    - name: Test CLI with themes
      run: |
        python -m libfake --generate --theme default --quiet
        python -m libfake --generate --theme elegant --quiet
        python -m libfake --generate --theme minimal --quiet
        python -m libfake --generate --theme colorful --quiet

    - name: Test CLI with JSON output
      run: |
        python -m libfake --details --json --quiet
        python -m libfake --generate --json --quiet

    - name: Test CLI with formatting options
      run: |
        python -m libfake --firstname --uppercase --quiet
        python -m libfake --firstname --lowercase --quiet
        python -m libfake --firstname --count 3 --separator ", " --quiet

    - name: Test Python API
      run: |
        python -c "
        from libfake import FakeName
        fake = FakeName()
        
        # Test basic functionality
        first = fake.get_firstname()
        surname = fake.get_surname()
        full = fake.get_full_name()
        email = fake.generate_email()
        details = fake.get_details()
        
        print(f'First name: {first}')
        print(f'Surname: {surname}')
        print(f'Full name: {full}')
        print(f'Email: {email}')
        print(f'Details: {details}')
        
        # Test custom email
        custom_email = fake.generate_email('John', 'Doe')
        print(f'Custom email: {custom_email}')
        
        # Test details with custom names
        custom_details = fake.get_details('Alice', 'Smith')
        print(f'Custom details: {custom_details}')
        
        print('✅ All Python API tests passed')
        "

    - name: Test version management
      run: |
        python version_manager.py --show
        python version_manager.py --check

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Install package dependencies
      run: |
        pip install -e .

    - name: Check code formatting with black
      run: |
        black --check --diff src/

    - name: Check import sorting with isort
      run: |
        isort --check-only --diff src/

    - name: Lint with flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

    - name: Type check with mypy
      run: |
        mypy src/libfake/ --ignore-missing-imports || echo "Type checking completed with warnings"

  security:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Install package
      run: |
        pip install -e .

    - name: Run bandit security check
      run: |
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/

    - name: Check dependencies for known vulnerabilities
      run: |
        safety check --json --output safety-report.json || true
        safety check

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json

  build-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      run: |
        python -m build

    - name: Check package
      run: |
        twine check dist/*

    - name: Test wheel installation
      run: |
        pip install dist/*.whl
        python -c "import libfake; print(f'✅ Wheel installation successful: {libfake.__version__}')"
        python -m libfake --version

    - name: Test source installation
      run: |
        pip uninstall -y libfake
        pip install dist/*.tar.gz
        python -c "import libfake; print(f'✅ Source installation successful: {libfake.__version__}')"
        python -m libfake --version

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ github.sha }}
        path: dist/

  coverage:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        # Create a simple test to measure coverage
        mkdir -p tests
        cat > tests/test_basic.py << 'EOF'
        import pytest
        from libfake import FakeName

        def test_import():
            """Test that the package imports correctly."""
            assert FakeName is not None

        def test_basic_functionality():
            """Test basic functionality."""
            fake = FakeName()
            
            # Test all main methods
            first = fake.get_firstname()
            assert isinstance(first, str)
            assert len(first) > 0
            
            surname = fake.get_surname()
            assert isinstance(surname, str)
            assert len(surname) > 0
            
            full = fake.get_full_name()
            assert isinstance(full, str)
            assert " " in full
            
            email = fake.generate_email()
            assert isinstance(email, str)
            assert "@" in email
            
            details = fake.get_details()
            assert isinstance(details, dict)
            assert "full_name" in details
            assert "email" in details

        def test_custom_generation():
            """Test custom name generation."""
            fake = FakeName()
            
            email = fake.generate_email("John", "Doe")
            assert "john" in email.lower()
            assert "doe" in email.lower()
            
            details = fake.get_details("Alice", "Smith")
            assert details["first_name"] == "Alice"
            assert details["surname"] == "Smith"
        EOF
        
        pytest tests/ --cov=src/libfake --cov-report=xml --cov-report=html --cov-report=term

    - name: Upload coverage reports
      uses: actions/upload-artifact@v4
      with:
        name: coverage-reports
        path: |
          coverage.xml
          htmlcov/
