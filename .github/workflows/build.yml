name: Build and Publish LibFake Package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major) or skip for no bump'
        required: false
        default: 'skip'
        type: choice
        options:
          - skip
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version (e.g., 1.2.3) - overrides version_bump'
        required: false
        type: string
      version_suffix:
        description: 'Version suffix (e.g., rc1, a1, b1) - optional'
        required: false
        type: string
      dry_run:
        description: 'Dry run (build only, do not publish)'
        required: false
        default: false
        type: boolean

  push:
    tags:
      - 'v*'

  release:
    types: [published]

jobs:
  version-check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_publish: ${{ steps.check-publish.outputs.should_publish }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rich

      - name: Update version if requested
        if: ${{ github.event.inputs.version_bump != 'skip' || github.event.inputs.custom_version != '' }}
        run: |
          if [ "${{ github.event.inputs.custom_version }}" != "" ]; then
            echo "Setting custom version: ${{ github.event.inputs.custom_version }}"
            python version_manager.py --set "${{ github.event.inputs.custom_version }}" --suffix "${{ github.event.inputs.version_suffix }}"
          elif [ "${{ github.event.inputs.version_bump }}" != "skip" ]; then
            echo "Bumping version: ${{ github.event.inputs.version_bump }}"
            python version_manager.py --bump "${{ github.event.inputs.version_bump }}" --suffix "${{ github.event.inputs.version_suffix }}"
          fi

      - name: Get current version
        id: get-version
        run: |
          VERSION=$(python version_manager.py --show | grep "Current version:" | cut -d' ' -f3)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Validate version consistency
        run: |
          python version_manager.py --check
          echo "✅ Version consistency validated"

      - name: Check if should publish
        id: check-publish
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "should_publish=false" >> $GITHUB_OUTPUT
            echo "🚫 Dry run mode - will not publish"
          else
            echo "should_publish=true" >> $GITHUB_OUTPUT
            echo "✅ Will publish to PyPI"
          fi

      - name: Commit version changes
        if: ${{ github.event.inputs.version_bump != 'skip' || github.event.inputs.custom_version != '' }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/libfake/_version.py
          git commit -m "🔖 Bump version to ${{ steps.get-version.outputs.version }}" || echo "No changes to commit"
          git push origin ${{ github.ref_name }} || echo "Push failed, continuing..."

  test:
    runs-on: ubuntu-latest
    needs: version-check
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Test CLI functionality
        run: |
          # Test basic CLI commands
          python -m libfake --version
          python -m libfake --firstname --quiet
          python -m libfake --generate --json --quiet
          python -m libfake --details --theme minimal --quiet
          echo "✅ CLI tests passed"

      - name: Test Python API
        run: |
          python -c "
          from libfake import FakeName
          fake = FakeName()
          print('First name:', fake.get_firstname())
          print('Email:', fake.generate_email())
          print('Profile:', fake.get_details())
          print('✅ Python API tests passed')
          "

      - name: Run version consistency check
        run: |
          python version_manager.py --check

  build:
    runs-on: ubuntu-latest
    needs: [version-check, test]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Install package dependencies
        run: |
          pip install rich

      - name: Verify package structure
        run: |
          echo "📁 Package structure:"
          find src/ -name "*.py" | head -20
          echo ""
          echo "📄 Data files:"
          find src/ -name "*.DIC" | head -10
          echo ""
          echo "🔍 Version info:"
          python version_manager.py --show

      - name: Build the package
        run: |
          echo "🔨 Building package..."
          python -m build
          echo "✅ Build completed"

      - name: Verify build artifacts
        run: |
          echo "📦 Build artifacts:"
          ls -la dist/
          echo ""
          echo "📋 Package contents:"
          tar -tf dist/*.tar.gz | head -20

      - name: Test installation from built package
        run: |
          echo "🧪 Testing installation..."
          pip install dist/*.whl
          python -c "import libfake; print('✅ Package imports successfully')"
          python -m libfake --version
          echo "✅ Installation test passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libfake-${{ needs.version-check.outputs.version }}-distribution
          path: dist/
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    needs: [version-check, test, build]
    if: needs.version-check.outputs.should_publish == 'true'
    
    environment:
      name: pypi
      url: https://pypi.org/project/libfake/

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: libfake-${{ needs.version-check.outputs.version }}-distribution
          path: dist/

      - name: Verify artifacts
        run: |
          echo "📦 Artifacts to publish:"
          ls -la dist/
          echo ""
          echo "🔍 Package info:"
          python -m pip install twine
          twine check dist/*

      - name: Publish to TestPyPI (if not a release)
        if: github.event_name != 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_TOKEN }}
          TWINE_REPOSITORY: testpypi
        run: |
          echo "🚀 Publishing to TestPyPI..."
          twine upload dist/* --verbose

      - name: Publish to PyPI (if release)
        if: github.event_name == 'release'
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          echo "🚀 Publishing to PyPI..."
          twine upload dist/* --verbose

      - name: Create GitHub Release (if manual trigger)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version-check.outputs.version }}
          name: LibFake v${{ needs.version-check.outputs.version }}
          body: |
            🎉 **LibFake v${{ needs.version-check.outputs.version }}** has been released!
            
            ## 🆕 What's New
            - Professional fake data generation
            - Beautiful CLI with Rich styling
            - Multiple output formats (JSON, tables, lists)
            - Theme support (default, elegant, minimal, colorful)
            - Centralized version management
            
            ## 📥 Installation
            ```bash
            pip install libfake==${{ needs.version-check.outputs.version }}
            ```
            
            ## 🚀 Quick Start
            ```bash
            # Generate a profile
            libfake --generate
            
            # Generate multiple names with elegant theme
            libfake --firstname --count 5 --theme elegant
            
            # Get detailed profile in JSON
            libfake --details --json
            ```
            
            ## 📚 Documentation
            See the [README](README.md) for complete usage instructions.
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.version-check.outputs.version, 'rc') || contains(needs.version-check.outputs.version, 'a') || contains(needs.version-check.outputs.version, 'b') }}

  notification:
    runs-on: ubuntu-latest
    needs: [version-check, publish]
    if: always()

    steps:
      - name: Notify completion
        run: |
          if [ "${{ needs.publish.result }}" = "success" ]; then
            echo "🎉 LibFake v${{ needs.version-check.outputs.version }} published successfully!"
          elif [ "${{ needs.version-check.outputs.should_publish }}" = "false" ]; then
            echo "📦 LibFake v${{ needs.version-check.outputs.version }} built successfully (dry run)"
          else
            echo "❌ Publication failed for v${{ needs.version-check.outputs.version }}"
            exit 1
          fi
