# .github/workflows/publish.yml

name: Build and Publish Python Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on tags like v1.2.3, v1.2.3-rc1

  workflow_dispatch:
    inputs:
      version:
        description: 'The version to publish (e.g., 1.2.3 or 1.2.3-rc1)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install package in editable mode with test dependencies
          pip install -e ".[test]"

      - name: Run tests with pytest
        run: |
          pytest --cov=src/libfake --cov-report=xml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  build-and-publish:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest
    needs: test
    # This job only runs when a tag is pushed or workflow is dispatched
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    permissions:
      contents: write  # Required for creating GitHub releases
      id-token: write # Required for trusted publishing to PyPI

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Get version
        id: get_version
        run: |
          # For tags like 'v1.2.3', remove 'v' and 'refs/tags/'
          # For workflow_dispatch, use the user-provided input
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${{ github.ref_name }}
            VERSION=${VERSION#v} # Remove 'v' prefix if it exists
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Update package version
        run: |
          # This assumes you have a placeholder for version in your __init__.py or setup.cfg
          # Example for setup.cfg:
          sed -i "s/^version = .*/version = ${{ steps.get_version.outputs.VERSION }}/" setup.cfg
          # Example for __init__.py:
          # sed -i "s/__version__ = .*/__version__ = \"${{ steps.get_version.outputs.VERSION }}\"/" src/libfake/__init__.py
          echo "Updated version in setup.cfg"
          cat setup.cfg | grep "version ="

      - name: Build the package
        run: python -m build

      - name: Check metadata and artifacts
        run: |
          twine check dist/*
          ls -l dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No need for manual TWINE_PASSWORD, this action uses trusted publishing
        # No 'if' condition needed here, as the job itself has a condition

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: LibFake v${{ steps.get_version.outputs.VERSION }}
          body: |
            🎉 **LibFake v${{ steps.get_version.outputs.VERSION }}** has been released!
            
            Find the package on [PyPI](https://pypi.org/project/libfake/${{ steps.get_version.outputs.VERSION }}/).
            
            *Release notes can be added here manually or generated automatically.*
          files: dist/*
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'rc') || contains(steps.get_version.outputs.VERSION, 'a') || contains(steps.get_version.outputs.VERSION, 'b') }}

  notification:
    name: Notify on Completion
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: always() # Run even if previous jobs fail

    steps:
      - name: Send notification
        run: |
          if [ "${{ needs.build-and-publish.result }}" = "success" ]; then
            echo "✅ Successfully published package."
          else
            echo "❌ Failed to publish package. Check the logs."
            exit 1
          fi# .github/workflows/publish.yml

